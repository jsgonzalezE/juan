name: Pruebas y publicación

on:
  push:
    branches: [main, claude/burman-coffee-inventory-5sa1pl]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# cada ref usa su propio grupo: un PR no debe cancelar un despliegue en curso
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del motor
        run: node tests/engine.test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          commit_message: 'Publicación automática'
